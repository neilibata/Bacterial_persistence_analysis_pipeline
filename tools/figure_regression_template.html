<title>Supplementary Figure Regressions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: slot rail on the left, a light-table stage on the right; the stage shows one before/after pair with its measurements. */
:root{
  --paper:#F3F5F7; --card:#FFFFFF; --sunk:#E9EDF1; --stage:#DDE2E7;
  --ink:#0E141B; --body:#33404E; --muted:#5D6B7A; --rule:#D5DCE3;
  --sig:#2D6CB5; --sig-ink:#FFFFFF; --before:#8A5A00; --after:#1F6E54;
  --bad:#B63A24; --bad-soft:#F8E4DF; --ok:#2C7A57; --ok-soft:#E1F1E9;
  --sans:Archivo, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1318; --card:#171D24; --sunk:#1C232B; --stage:#232B34;
  --ink:#EAEFF4; --body:#BCC7D2; --muted:#8A97A4; --rule:#2A333D;
  --sig:#63A6E0; --sig-ink:#0F1318; --before:#E0B35A; --after:#6CCBA3;
  --bad:#EE7A60; --bad-soft:#321C17; --ok:#5CBF92; --ok-soft:#14281D; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1318; --card:#171D24; --sunk:#1C232B; --stage:#232B34;
  --ink:#EAEFF4; --body:#BCC7D2; --muted:#8A97A4; --rule:#2A333D;
  --sig:#63A6E0; --sig-ink:#0F1318; --before:#E0B35A; --after:#6CCBA3;
  --bad:#EE7A60; --bad-soft:#321C17; --ok:#5CBF92; --ok-soft:#14281D; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--body);font-family:var(--sans);font-size:14px;line-height:1.45}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.rail{background:var(--card);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;max-height:100vh;position:sticky;top:0}
.rail header{padding:16px 16px 10px;display:grid;gap:6px;border-bottom:1px solid var(--rule)}
.rail h1{font-size:16px;margin:0;color:var(--ink);letter-spacing:-.01em;text-wrap:balance}
.rail .src{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.src b{font-weight:600}.src .b{color:var(--before)}.src .a{color:var(--after)}
.filters{display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--rule)}
.list{overflow:auto;padding:6px 8px 16px;display:grid;gap:2px;align-content:start}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:4px;cursor:pointer;border:0;background:transparent;color:var(--body);font:inherit;text-align:left}
.item:hover{background:var(--sunk)}
.item[aria-current="true"]{background:var(--sig);color:var(--sig-ink)}
.item .num{font-family:var(--mono);font-weight:600}
.item .d{font-family:var(--mono);font-size:11px;opacity:.85}
.chip{font-family:var(--mono);font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px;letter-spacing:.03em}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.na{background:var(--sunk);color:var(--muted)}
.item[aria-current="true"] .chip{background:var(--sig-ink);color:var(--sig)}
button.seg{font-family:var(--mono);font-size:11px;padding:5px 10px;border:1px solid var(--rule);background:var(--card);color:var(--muted);border-radius:3px;cursor:pointer}
button.seg[aria-pressed="true"]{background:var(--sig);border-color:var(--sig);color:var(--sig-ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
main{min-width:0;display:grid;grid-template-rows:auto auto 1fr}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:3}
.toolbar h2{font-size:18px;margin:0;color:var(--ink);font-weight:700}
.toolbar .modes{display:flex;gap:4px;flex-wrap:wrap}
.toolbar .hint{margin-left:auto;font-size:11px;color:var(--muted)}
.metrics{padding:12px 20px;display:grid;gap:8px;background:var(--paper);border-bottom:1px solid var(--rule)}
.why{font-size:13px;color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font-size:12px}
th,td{padding:4px 12px 4px 0;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
td.up{color:var(--bad);font-weight:600} td.down{color:var(--ok)}
.stage{background:var(--stage);padding:20px;display:grid;gap:16px;align-content:start;min-width:0}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.pane{display:grid;gap:6px;min-width:0;align-content:start}
.pane .lab{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.lab.b{color:var(--before)} .lab.a{color:var(--after)}
.pane .file{font-family:var(--mono);font-size:10.5px;color:var(--muted);overflow-wrap:anywhere}
.sheet{background:#FFFFFF;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 30px -18px rgba(0,0,0,.45);overflow:hidden;position:relative}
.sheet img{display:block;width:100%;height:auto}
.guides .sheet::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(45,108,181,.18) 1px,transparent 1px),linear-gradient(to bottom,rgba(45,108,181,.18) 1px,transparent 1px);background-size:10% 10%}
.swipe{position:relative;max-width:1200px}
.swipe .top{position:absolute;inset:0;overflow:hidden;border-right:2px solid var(--sig)}
.swipe .top img{width:auto;height:100%;max-width:none}
.slider{width:100%;max-width:1200px}
.solo{max-width:1200px}
.empty{padding:40px;color:var(--muted);font-style:italic}
@media (max-width:820px){.app{grid-template-columns:1fr}.rail{position:static;max-height:none}.list{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.pair{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <header>
      <h1>Supplementary figure regressions</h1>
      <div class="src" id="src"></div>
    </header>
    <div class="filters" role="group" aria-label="Filter">
      <button class="seg" type="button" data-f="all">All</button>
      <button class="seg" type="button" data-f="flag">Flagged</button>
    </div>
    <nav class="list" id="list" aria-label="Figures"></nav>
  </aside>
  <main>
    <div class="toolbar">
      <h2 id="title">—</h2>
      <div class="modes" role="group" aria-label="View">
        <button class="seg" type="button" data-m="pair">Side by side</button>
        <button class="seg" type="button" data-m="swipe">Swipe</button>
        <button class="seg" type="button" data-m="flicker">Flicker</button>
        <button class="seg" type="button" data-m="before">Before</button>
        <button class="seg" type="button" data-m="after">After</button>
        <button class="seg" type="button" id="guides" aria-pressed="false">10% grid</button>
      </div>
      <span class="hint">↑ ↓ figure · 1–5 view · g grid</span>
    </div>
    <section class="metrics" id="metrics"></section>
    <section class="stage" id="stage"></section>
  </main>
</div>

<script>
const DATA = /*DATA*/;
const S = DATA.slots;
let st = {i:0, f:"all", m:"pair", guides:false};
try{ Object.assign(st, JSON.parse(localStorage.getItem("figreg")||"{}")); }catch(e){}
const save=()=>{try{localStorage.setItem("figreg",JSON.stringify({f:st.f,m:st.m,guides:st.guides,i:st.i}))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=v=>(100*v).toFixed(1)+"%";
const LBL={gap_v:"Blank bands between rows of panels",max_v:"Widest horizontal gap",gap_h:"Blank bands between columns of panels",max_h:"Widest vertical gap",margin:"Outer margin",aspect:"Content aspect (w/h)"};
document.getElementById("src").innerHTML=`<b class="b">Before</b> ${esc(DATA.before_label)}<br><b class="a">After</b> ${esc(DATA.after_label)}<br>Flag: a gap or the outer margin grows by more than ${DATA.flag_pp} pp, or the aspect ratio moves by more than 10%.`;
function chip(s){ if(!s.delta) return `<span class="chip na">${s.before?"no after":"new"}</span>`; return s.flags.length?`<span class="chip bad">${s.flags.length} flag${s.flags.length>1?"s":""}</span>`:`<span class="chip ok">ok</span>`; }
function visible(){ return S.map((s,i)=>i).filter(i=>st.f==="all"||(S[i].flags&&S[i].flags.length)); }
function renderList(){
  const v=visible(); if(!v.includes(st.i)&&v.length) st.i=v[0];
  document.getElementById("list").innerHTML=v.map(i=>{const s=S[i];const d=s.delta?`Δv ${s.delta.gap_v>0?"+":""}${s.delta.gap_v} · Δh ${s.delta.gap_h>0?"+":""}${s.delta.gap_h}`:"";
    return `<button class="item" type="button" data-i="${i}" aria-current="${i===st.i}"><span class="num">S${s.n}</span><span class="d">${d}</span>${chip(s)}</button>`}).join("")||`<p class="empty">No flagged figures.</p>`;
  document.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===st.f));
}
function renderMetrics(s){
  const el=document.getElementById("metrics");
  if(!s.before||!s.after){el.innerHTML=`<div class="why">${s.before?"No figure for this slot in the run.":"Not in the before document."}</div>`;return;}
  const rows=["gap_v","max_v","gap_h","max_h","margin","aspect"].map(k=>{
    const b=s.before[k],a=s.after[k]; const isA=k==="aspect";
    const d=isA?s.delta.aspect_pct:s.delta[k]; const bad=isA?Math.abs(d)>10:d>DATA.flag_pp; const good=!isA&&d<-DATA.flag_pp;
    return `<tr><td>${LBL[k]}</td><td class="mono">${isA?b.toFixed(2):pct(b)}</td><td class="mono">${isA?a.toFixed(2):pct(a)}</td><td class="mono ${bad?"up":good?"down":""}">${d>0?"+":""}${d}${isA?"%":" pp"}</td></tr>`}).join("");
  const why=s.flags.length?`Flagged: ${s.flags.map(f=>f==="aspect"?"aspect ratio changed":LBL[f].toLowerCase()+" grew").join("; ")}.`:"No measurable layout regression.";
  el.innerHTML=`<div class="why">${esc(why)}</div><div class="tablewrap"><table><thead><tr><th>Measure</th><th>Before</th><th>After</th><th>Change</th></tr></thead><tbody>${rows}
    <tr><td>Canvas (source px)</td><td class="mono">${esc(s.before.px)}</td><td class="mono">${esc(s.after.px)}</td><td></td></tr></tbody></table></div>`;
}
let flickT=null;
function renderStage(s){
  clearInterval(flickT); const el=document.getElementById("stage"); el.classList.toggle("guides",st.guides);
  const pane=(k,cls)=>s[k]?`<div class="pane"><span class="lab ${cls}">${k}</span><div class="sheet"><img src="${s[k].src}" alt="Fig. S${s.n} ${k}"></div><span class="file">${esc(s[k].file)} · ${esc(s[k].px)}</span></div>`:`<div class="pane"><span class="lab ${cls}">${k}</span><p class="empty">none</p></div>`;
  const m=(!s.before||!s.after)&&["swipe","flicker"].includes(st.m)?"pair":st.m;
  if(m==="pair") el.innerHTML=`<div class="pair">${pane("before","b")}${pane("after","a")}</div>`;
  else if(m==="before"||m==="after") el.innerHTML=`<div class="solo">${pane(m,m==="before"?"b":"a")}</div>`;
  else if(m==="swipe"){
    el.innerHTML=`<input class="slider" id="sw" type="range" min="0" max="100" value="50" aria-label="Swipe position"><div class="sheet swipe" id="swb"><img src="${s.after.src}" alt="after"><div class="top" id="swt" style="width:50%"><img src="${s.before.src}" alt="before"></div></div><span class="file">left: <b style="color:var(--before)">before</b> · right: <b style="color:var(--after)">after</b> · both scaled to the same width</span>`;
    const box=document.getElementById("swb"), top=document.getElementById("swt"), ti=top.querySelector("img");
    const fit=()=>{ti.style.width=box.clientWidth+"px"; ti.style.height=box.clientHeight+"px";}; fit(); box.querySelector("img").onload=fit; window.onresize=fit;
    document.getElementById("sw").oninput=e=>top.style.width=e.target.value+"%";
  } else {
    el.innerHTML=`<div class="solo"><span class="lab b" id="fl">before</span><div class="sheet"><img id="fi" src="${s.before.src}" alt="flicker"></div><span class="file">alternates every 0.8 s; both scaled to the same width</span></div>`;
    let on=false; flickT=setInterval(()=>{on=!on;const i=document.getElementById("fi"),l=document.getElementById("fl"); if(!i){clearInterval(flickT);return;} i.src=on?s.after.src:s.before.src; l.textContent=on?"after":"before"; l.className="lab "+(on?"a":"b");},800);
  }
}
function render(){
  renderList(); const s=S[st.i]; if(!s) return;
  document.getElementById("title").textContent=`Fig. S${s.n}`;
  document.querySelectorAll("[data-m]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===st.m));
  document.getElementById("guides").setAttribute("aria-pressed",st.guides);
  renderMetrics(s); renderStage(s); save();
}
document.addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.i!==undefined){st.i=+b.dataset.i;render();}
  else if(b.dataset.f){st.f=b.dataset.f;render();}
  else if(b.dataset.m){st.m=b.dataset.m;render();}
  else if(b.id==="guides"){st.guides=!st.guides;render();}});
document.addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT") return;
  const v=visible(), p=v.indexOf(st.i);
  if(e.key==="ArrowDown"||e.key==="j"){e.preventDefault(); if(p<v.length-1){st.i=v[p+1];render();}}
  else if(e.key==="ArrowUp"||e.key==="k"){e.preventDefault(); if(p>0){st.i=v[p-1];render();}}
  else if("12345".includes(e.key)){st.m=["pair","swipe","flicker","before","after"][+e.key-1];render();}
  else if(e.key==="g"){st.guides=!st.guides;render();}});
if(st.i>=S.length) st.i=0;
render();
</script>
