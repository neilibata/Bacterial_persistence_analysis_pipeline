# Pinned conda environment for the published run (postprocessing pipeline + figures + explorer).
# Create with:  conda env create -f environment.yml  &&  conda activate microbiome-extinctions
# (cartopy is intentionally omitted — the maps use geopandas + Natural Earth, not cartopy.)
name: microbiome-extinctions
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.15.1
  - matplotlib=3.10.0
  - openpyxl=3.1.5
  - seaborn=0.13.2
  - scikit-learn=1.7.1
  - statsmodels=0.14.4
  - joblib=1.4.2
  - patsy=0.5.6
  - shapely=2.0.7
  - geopandas=1.0.1
  - plotly=6.5.0
  - pyogrio=0.10.0
  - pillow=10.3.0
  - pip
